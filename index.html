          baseSpp,
          baseInfaq,
          discountPercent,

                  Jl. Cempaka 168, Kemiling Permai, Bandar Lampung.<br /><br />
                  Telp: 0812-3456-7890<br />
                  Email: info@alfirdaus.sch.id
                </p>
              </div>

              <div>
                <h4 className="text-white font-bold text-sm mb-4">Sosial Media</h4>
                <div className="flex gap-3 text-slate-300">
                  <a href="#" className="p-2 bg-slate-800 hover:bg-emerald-600 rounded-lg transition"><Facebook className="w-4 h-4" /></a>
                  <a href="#" className="p-2 bg-slate-800 hover:bg-emerald-600 rounded-lg transition"><Instagram className="w-4 h-4" /></a>
                  <a href="#" className="p-2 bg-slate-800 hover:bg-emerald-600 rounded-lg transition"><Youtube className="w-4 h-4" /></a>
                </div>
              </div>
            </div>

            <div className="max-w-7xl mx-auto border-t border-slate-900 mt-12 pt-6 text-center text-xs text-slate-600">
              © 2026 Pondok Pesantren & SIT Al Firdaus Kemiling Permai. Hak Cipta Dilindungi.
            </div>
          </footer>

          {/* MODAL LOGIN ADMIN */}
          {loginModalOpen && (
            <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white dark:bg-slate-800 p-8 rounded-3xl max-w-md w-full shadow-2xl space-y-6 relative border border-slate-200 dark:border-slate-700">
                <button onClick={() => setLoginModalOpen(false)} className="absolute top-4 right-4 text-slate-400 hover:text-slate-600"><X className="w-5 h-5" /></button>
                <div className="text-center space-y-2">
                  <div className="w-12 h-12 bg-emerald-100 text-emerald-700 rounded-2xl flex items-center justify-center mx-auto"><Lock className="w-6 h-6" /></div>
                  <h3 className="text-xl font-bold">Login Portal Admin</h3>
                  <p className="text-xs text-slate-500">Masukkan kredensial admin untuk mengedit situs.</p>
                </div>

                {loginError && <div className="p-3 bg-red-100 text-red-700 rounded-xl text-xs font-semibold">{loginError}</div>}

                <form onSubmit={handleLoginSubmit} className="space-y-4 text-sm">
                  <div>
                    <label className="text-xs font-bold text-slate-500">Username</label>
                    <input
                      type="text"
                      required
                      placeholder="Default: admin"
                      value={adminUsername}
                      onChange={(e) => setAdminUsername(e.target.value)}
                      className="w-full p-3 rounded-xl border border-slate-300 dark:border-slate-600 bg-slate-50 dark:bg-slate-700 mt-1"
                    />
                  </div>

                  <div>
                    <label className="text-xs font-bold text-slate-500">Password</label>
                    <input
                      type="password"
                      required
                      placeholder="Default: admin123"
                      value={adminPassword}
                      onChange={(e) => setAdminPassword(e.target.value)}
                      className="w-full p-3 rounded-xl border border-slate-300 dark:border-slate-600 bg-slate-50 dark:bg-slate-700 mt-1"
                    />
                  </div>

                  <button type="submit" className="w-full py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl shadow transition">
                    Masuk Portal Admin
                  </button>
                </form>
              </div>
            </div>
          )}

          {/* MODAL EDIT SLIDE */}
          {editingSlide && (
            <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white dark:bg-slate-800 p-8 rounded-3xl max-w-lg w-full shadow-2xl space-y-4 relative border border-slate-200 dark:border-slate-700 text-sm">
                <button onClick={() => setEditingSlide(null)} className="absolute top-4 right-4 text-slate-400 hover:text-slate-600"><X className="w-5 h-5" /></button>
                <h3 className="text-xl font-bold text-emerald-700">Edit Slide Banner #{editingSlide.id}</h3>

                <div className="space-y-3">
                  <div>
                    <label className="text-xs font-bold">Badge Teks</label>
                    <input
                      type="text"
                      value={editingSlide.badge}
                      onChange={(e) => setEditingSlide({ ...editingSlide, badge: e.target.value })}
                      className="w-full p-2.5 rounded-xl border border-slate-300 dark:border-slate-600 bg-slate-50 dark:bg-slate-700"
                    />
                  </div>
                  <div>
                    <label className="text-xs font-bold">Judul Utama</label>
                    <input
                      type="text"
                      value={editingSlide.title}
                      onChange={(e) => setEditingSlide({ ...editingSlide, title: e.target.value })}
                      className="w-full p-2.5 rounded-xl border border-slate-300 dark:border-slate-600 bg-slate-50 dark:bg-slate-700"
                    />
                  </div>
                  <div>
                    <label className="text-xs font-bold">Subjudul Deskripsi</label>
                    <textarea
                      rows="3"
                      value={editingSlide.subtitle}
                      onChange={(e) => setEditingSlide({ ...editingSlide, subtitle: e.target.value })}
                      className="w-full p-2.5 rounded-xl border border-slate-300 dark:border-slate-600 bg-slate-50 dark:bg-slate-700"
                    ></textarea>
                  </div>
                  <div>
                    <label className="text-xs font-bold">URL Gambar Background</label>
                    <input
                      type="text"
                      value={editingSlide.image}
                      onChange={(e) => setEditingSlide({ ...editingSlide, image: e.target.value })}
                      className="w-full p-2.5 rounded-xl border border-slate-300 dark:border-slate-600 bg-slate-50 dark:bg-slate-700"
                    />
                  </div>
                </div>

                <div className="flex justify-end gap-2 pt-2">
                  <button onClick={() => setEditingSlide(null)} className="px-4 py-2 bg-slate-200 dark:bg-slate-700 rounded-xl font-bold">Batal</button>
                  <button
                    onClick={() => {
                      setSlides(slides.map(s => s.id === editingSlide.id ? editingSlide : s));
                      setEditingSlide(null);
                      showToast("Slide berhasil diperbarui!", "success");
                    }}
                    className="px-5 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl font-bold"
                  >
                    Simpan Perubahan
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* MODAL TAMBAH / EDIT BERITA */}
          {(isAddingNews || editingNews) && (
            <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white dark:bg-slate-800 p-8 rounded-3xl max-w-xl w-full shadow-2xl space-y-4 relative border border-slate-200 dark:border-slate-700 text-sm">
                <button onClick={() => { setIsAddingNews(false); setEditingNews(null); }} className="absolute top-4 right-4 text-slate-400"><X className="w-5 h-5" /></button>
                <h3 className="text-xl font-bold text-emerald-700">{editingNews ? "Edit Berita" : "Tambah Berita Baru"}</h3>

                <div className="space-y-3">
                  <div>
                    <label className="text-xs font-bold">Judul Berita</label>
                    <input
                      type="text"
                      value={newsFormData.title}
                      onChange={(e) => setNewsFormData({ ...newsFormData, title: e.target.value })}
                      className="w-full p-2.5 rounded-xl border border-slate-300 dark:border-slate-600 bg-slate-50 dark:bg-slate-700"
                    />
                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="text-xs font-bold">Kategori</label>
                      <select
                        value={newsFormData.category}
                        onChange={(e) => setNewsFormData({ ...newsFormData, category: e.target.value })}
                        className="w-full p-2.5 rounded-xl border border-slate-300 dark:border-slate-600 bg-slate-50 dark:bg-slate-700"
                      >
                        <option>Pengumuman</option>
                        <option>Prestasi</option>
                        <option>Kegiatan</option>
                      </select>
                    </div>
                    <div>
                      <label className="text-xs font-bold">Penulis</label>
                      <input
                        type="text"
                        value={newsFormData.author}
                        onChange={(e) => setNewsFormData({ ...newsFormData, author: e.target.value })}
                        className="w-full p-2.5 rounded-xl border border-slate-300 dark:border-slate-600 bg-slate-50 dark:bg-slate-700"
                      />
                    </div>
                  </div>
                  <div>
                    <label className="text-xs font-bold">URL Gambar</label>
                    <input
                      type="text"
                      placeholder="https://images.unsplash.com/..."
                      value={newsFormData.image}
                      onChange={(e) => setNewsFormData({ ...newsFormData, image: e.target.value })}
                      className="w-full p-2.5 rounded-xl border border-slate-300 dark:border-slate-600 bg-slate-50 dark:bg-slate-700"
                    />
                  </div>
                  <div>
                    <label className="text-xs font-bold">Isi Berita</label>
                    <textarea
                      rows="4"
                      value={newsFormData.content}
                      onChange={(e) => setNewsFormData({ ...newsFormData, content: e.target.value })}
                      className="w-full p-2.5 rounded-xl border border-slate-300 dark:border-slate-600 bg-slate-50 dark:bg-slate-700"
                    ></textarea>
                  </div>
                </div>

                <div className="flex justify-end gap-2 pt-2">
                  <button onClick={() => { setIsAddingNews(false); setEditingNews(null); }} className="px-4 py-2 bg-slate-200 dark:bg-slate-700 rounded-xl font-bold">Batal</button>
                  <button
                    onClick={() => {
                      if (editingNews) {
                        setNews(news.map(n => n.id === editingNews.id ? { ...newsFormData, id: editingNews.id } : n));
                        showToast("Berita berhasil diperbarui!", "success");
                      } else {
                        const newItem = {
                          ...newsFormData,
                          id: Date.now(),
                          date: "Oktober 2026",
                          image: newsFormData.image || "https://images.unsplash.com/photo-1577896851231-70ef18881754?auto=format&fit=crop&q=80&w=800"
                        };
                        setNews([newItem, ...news]);
                        showToast("Berita baru berhasil ditambahkan!", "success");
                      }
                      setIsAddingNews(false);
                      setEditingNews(null);
                    }}
                    className="px-5 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl font-bold"
                  >
                    Simpan Berita
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* MODAL BACA DETAIL BERITA */}
          {selectedNews && (
            <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white dark:bg-slate-800 p-8 rounded-3xl max-w-2xl w-full shadow-2xl space-y-4 relative border border-slate-200 dark:border-slate-700 max-h-[90vh] overflow-y-auto">
                <button onClick={() => setSelectedNews(null)} className="absolute top-4 right-4 text-slate-400 hover:text-slate-600"><X className="w-5 h-5" /></button>
                <img src={selectedNews.image} alt={selectedNews.title} className="w-full h-64 object-cover rounded-2xl" />
                <div className="flex items-center gap-2 text-xs text-slate-400">
                  <span className="bg-emerald-100 text-emerald-700 font-bold px-2.5 py-0.5 rounded-full">{selectedNews.category}</span>
                  <span>•</span>
                  <span>{selectedNews.date}</span>
                  <span>•</span>
                  <span>Oleh: {selectedNews.author}</span>
                </div>
                <h3 className="text-2xl font-bold leading-snug">{selectedNews.title}</h3>
                <p className="text-slate-600 dark:text-slate-300 text-sm leading-relaxed whitespace-pre-line">{selectedNews.content}</p>
              </div>
            </div>
          )}

        </div>
      );
    }

    // Mount Aplikasi ke DOM
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
